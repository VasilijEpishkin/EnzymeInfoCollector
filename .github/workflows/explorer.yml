name: Evidence explorer checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'explorer/**'
      - '.github/workflows/explorer.yml'

permissions:
  contents: read

jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check explorer/model.mjs && node --check explorer/app.mjs
      - name: Offline model tests
        run: node --test explorer/tests/model.test.mjs
      - name: Headless Chrome UI smoke (synthetic demo)
        run: python3 explorer/tests/smoke_browser.py
