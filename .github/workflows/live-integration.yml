name: Optional live UniProt-Rhea-ChEBI smoke
on:
  workflow_dispatch:
  push:
    branches:
      - feature/reference-dataset-builder
    paths:
      - enzymeinfocollector/rhea_participants.py
      - enzymeinfocollector/reference_dataset.py
      - enzymeinfocollector/reference_cli.py
      - .github/workflows/live-integration.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install .
      - name: Live integration (one reviewed protein; no data artifact)
        run: |
          python -m enzymeinfocollector.reference_cli --accession P04040 --output /tmp/eic-live.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/eic-live.json').read_text())
          assert len(result['proteins']) == 1
          assert result['proteins'][0]['accession'] == 'P04040'
          assert result['proteins'][0]['direct_assertions']
          assert result['reactions'], 'missing directly annotated Rhea reactions'
          assert all(row['status'] == 'rhea_record_found' for row in result['reactions'])
          assert all(
              part['side'] in ('left', 'right') and part['coefficient']
              for reaction in result['reactions']
              for part in reaction['compound_membership']
          )
          assert result['compounds'], 'no resolved chemical identities'
          assert not result['unresolved']['missing_rhea_master_ids']
          print('Live check passed',
                'proteins:', len(result['proteins']),
                'reactions:', len(result['reactions']),
                'compounds:', len(result['compounds']))
          PY
