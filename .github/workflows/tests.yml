name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.15"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional spreadsheet support
        run: python -m pip install .[xlsx]
      - name: Run tests
        run: python -m unittest discover -s tests -v
